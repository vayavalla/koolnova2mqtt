name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Test
        run: go test ./...

      - name: Create build directory
        run: mkdir -p dist

      - name: Build Linux AMD64
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -o dist/koolnova2mqtt_linux_amd64 .

      - name: Build Linux ARMv6
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm
          GOARM: 6
        run: go build -o dist/koolnova2mqtt_linux_armv6 .

      - name: Build macOS AMD64
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
        run: go build -o dist/koolnova2mqtt_darwin_amd64 .

      - name: Build Windows AMD64
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: go build -o dist/koolnova2mqtt_windows_amd64.exe .

      - name: Create checksums
        working-directory: dist
        run: sha256sum koolnova2mqtt_* > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/koolnova2mqtt_linux_amd64 \
            dist/koolnova2mqtt_linux_armv6 \
            dist/koolnova2mqtt_darwin_amd64 \
            dist/koolnova2mqtt_windows_amd64.exe \
            dist/SHA256SUMS \
            --title "Koolnova2mqtt $GITHUB_REF_NAME" \
            --generate-notes
